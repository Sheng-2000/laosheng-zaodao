/* ══════════ CSS VARIABLES ══════════ */
:root {
  --bg-primary:#0d1117;
  --bg-secondary:#161b22;
  --bg-card:#1c2333;
  --bg-hover:#21273a;
  --accent:#00d4ff;
  --accent-dim:rgba(0,212,255,0.15);
  --accent-border:rgba(0,212,255,0.35);
  --green:#3fb950;
  --red:#f85149;
  --yellow:#d29922;
  --purple:#bc8cff;
  --orange:#ffa657;
  --text-primary:#e6edf3;
  --text-secondary:#8b949e;
  --text-muted:#6e7681;
  --border:rgba(48,54,61,0.8);
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,'SF Pro Text','Yuanti SC','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.7;
  min-height:100vh;
  background-image: radial-gradient(ellipse 80% 40% at 50% -5%, rgba(0,80,160,0.10) 0%, transparent 60%);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  letter-spacing:0.15px;
}

/* 滚动条 */
::-webkit-scrollbar { width:6px;height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(139,148,158,0.35);border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(139,148,158,0.55); }


/* ══════════ HEADER ══════════ */
.header {
  background:linear-gradient(180deg, #0a1018 0%, #0c1523 100%);
  border-bottom:1px solid rgba(0,212,255,0.14);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(0,0,0,0.4);
  overflow:hidden;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.header::before {
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 25%,var(--purple) 75%,transparent 100%);
  opacity:0.6;
}

.header::after {
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size:60px 60px;
  animation:header-grid-move 20s linear infinite;
  pointer-events:none;
}
@keyframes header-grid-move {
  0% { transform:translate(0,0); }
  100% { transform:translate(60px,60px); }
}

.header-inner {
  max-width:1200px;
  margin:0 auto;
  padding:18px 24px 16px;
  position:relative;z-index:1;
}

.header-top {
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:16px;
}

/* ══ BRAND ICON ══ */
.brand-icon {
  width:56px;height:56px;
  background:linear-gradient(145deg,#0a1e35 0%,#0d2040 60%,#091828 100%);
  border:1px solid rgba(0,212,255,0.16);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,212,255,0.16),inset 0 1px 0 rgba(255,255,255,0.08);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.brand-icon::before {
  content:'';position:absolute;top:-4px;left:-4px;width:24px;height:24px;
  background:radial-gradient(circle,rgba(0,212,255,0.22) 0%,transparent 70%);
}
.brand-icon::after {
  content:'';position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(135deg,rgba(0,212,255,0.08) 0%,transparent 55%);
}
.brand-icon svg { width:28px;height:28px;position:relative;z-index:1; }
/* 闪电本体特效：霓虹辉光 + 呼吸脉动（仅作用于主闪电 path:first-child，装饰弧不动） */
.brand-icon svg path:first-child {
  filter:drop-shadow(0 0 1.5px rgba(0,212,255,0.55)) drop-shadow(0 0 3px rgba(0,212,255,0.25));
  animation:bolt-glow 3.2s ease-in-out infinite;
}
@keyframes bolt-glow {
  0%,100% { filter:drop-shadow(0 0 1.5px rgba(0,212,255,0.55)) drop-shadow(0 0 3px rgba(0,212,255,0.25)); }
  50%     { filter:drop-shadow(0 0 2px rgba(0,212,255,0.75)) drop-shadow(0 0 6px rgba(0,212,255,0.45)); }
}
@media (prefers-reduced-motion:reduce) {
  .brand-icon svg path:first-child { animation:none; }
}

/* ══ BRAND TITLE ══ */
.brand-title {
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
  line-height:1.2;
  min-width:0;
}

.brand-main-row {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.brand-signal {
  position:relative;
  display:inline-flex;
  align-items:center;
  cursor:default;
}

.brand-name {
  font-size:22px;
  font-weight:800;
  letter-spacing:3px;
  color:#e6edf3;
}
.brand-sep {
  position:relative;
  width:2px;
  height:18px;
  background:rgba(0,212,255,0.15);
  margin:0 8px;
  border-radius:1px;
}
.brand-sep::after {
  content:'';position:absolute;left:-1.5px;width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px rgba(0,212,255,0.8);
  animation:sep-slide 3s ease-in-out infinite;
}
.brand-zaodao {
  font-size:22px;
  font-weight:300;
  letter-spacing:3px;
  color:var(--accent);
  text-shadow:0 0 16px rgba(0,212,255,0.3);
}
@keyframes sep-slide { 0%{top:0;opacity:0} 15%{opacity:1} 50%{top:14px;opacity:1} 85%{opacity:1} 100%{top:0;opacity:0} }

.brand-en {
  font-size:9px;font-weight:600;letter-spacing:2px;
  color:var(--accent);opacity:0.5;text-transform:uppercase;
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  margin-bottom:2px;
}

.brand-tag {
  font-size:10px;color:var(--text-muted);
  opacity:0.6;
  white-space:nowrap;
}

.brand-subtitle {
  font-size:10.5px;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:nowrap;
  white-space:nowrap;
  margin-top:2px;
}
.brand-subtitle .dot { color:rgba(0,212,255,0.25);margin:0 4px; }


.live-dot {
  display:inline-block;width:6px;height:6px;
  background:var(--green);border-radius:50%;
  box-shadow:0 0 6px var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

/* ══ HEADER META ══ */
.header-meta {
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  flex-shrink:0;
  padding-left:16px;
  border-left:1px solid rgba(0,212,255,0.1);
}
.hm-date {
  font-size:18px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--accent);
  line-height:1;
  text-shadow:0 0 12px rgba(0,212,255,0.4);
  font-family:'SF Mono','Fira Code','Consolas',monospace;
}
.hm-sub {
  font-size:10px;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.hm-sub .sep { color:rgba(0,212,255,0.2); }

/* ══════════ CONTENT ══════════ */
.main-content { max-width:1200px;margin:0 auto;padding:32px 24px 0; }

.section-title {
  font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--accent);padding-left:12px;border-left:2px solid var(--accent);margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after {
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(0,212,255,0.2),transparent);
}

/* ══════════ HERO CARD (最新一期) ══════════ */
.hero-card {
  position:relative;
  background:var(--bg-card);
  border-radius:14px;
  margin-bottom:36px;
  overflow:hidden;
  transition:transform 0.3s ease, box-shadow 0.3s ease;
  cursor:pointer;
  text-decoration:none;
  display:block;
  -webkit-tap-highlight-color:transparent;
}

.hero-card-border {
  position:absolute;inset:0;border-radius:14px;padding:1.5px;
  background:linear-gradient(135deg,rgba(0,212,255,0.5),rgba(188,140,255,0.42),rgba(0,212,255,0.5));
  background-size:200% 200%;
  animation:hero-border-shift 6s ease-in-out infinite, hero-border-breathe 4.5s ease-in-out infinite;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
@keyframes hero-border-shift {
  0%,100% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
}
@keyframes hero-border-breathe {
  0%,100% { opacity:0.5; }
  50% { opacity:0.9; }
}

.hero-card::before {
  content:'';position:absolute;top:0;left:0;right:0;height:100px;
  background:linear-gradient(180deg,rgba(0,212,255,0.05) 0%,transparent 100%);
  pointer-events:none;z-index:1;
}

.hero-card:active {
  transform:scale(0.99);
}

.hero-card-inner {
  display:flex;
  align-items:stretch;
  position:relative;
  z-index:2;
}

.hero-date-block {
  flex-shrink:0;
  width:124px;
  background:linear-gradient(160deg,rgba(0,212,255,0.08) 0%,rgba(0,212,255,0.02) 100%);
  border-right:1px solid rgba(0,212,255,0.1);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  gap:2px;
  position:relative;
}
.hero-date-block::before {
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:32px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--purple));
}

.hero-date-day {
  font-size:52px;font-weight:900;line-height:1;
  color:var(--text-primary);
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  text-shadow:0 0 24px rgba(0,212,255,0.2);
}
.hero-date-month {
  font-size:14px;font-weight:600;color:var(--accent);letter-spacing:1px;
}
.hero-date-weekday {
  font-size:11px;color:var(--text-muted);margin-top:6px;
  background:rgba(0,212,255,0.08);padding:3px 10px;border-radius:20px;
}

.hero-content-block {
  flex:1;
  padding:20px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
  min-width:0;
}

.hero-badge-row {
  display:flex;align-items:center;gap:8px;
}
.hero-badge {
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,var(--accent),#0099cc);
  color:#0d1117;font-size:9px;font-weight:800;
  padding:3px 10px;border-radius:20px;letter-spacing:1px;
  text-transform:uppercase;
}
.hero-badge-dot {
  width:4px;height:4px;border-radius:50%;background:#0d1117;
  animation:pulse 1.5s ease-in-out infinite;
}
.hero-label {
  font-size:10px;color:var(--text-muted);
}

.hero-title {
  font-size:16px;font-weight:700;color:var(--text-primary);
  line-height:1.5;
  transition:color 0.3s;
  word-break:break-word;
}

.hero-tags {
  display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;
}
.hero-tag {
  font-size:10px;padding:2px 10px;border-radius:4px;
  background:rgba(0,212,255,0.06);
  border:1px solid rgba(0,212,255,0.12);
  color:var(--text-secondary);
  transition:all 0.3s;
}
.hero-tag:nth-child(1) { border-color:rgba(0,212,255,0.25);color:var(--accent); }
.hero-tag:nth-child(2) { border-color:rgba(188,140,255,0.25);color:var(--purple); }
.hero-tag:nth-child(3) { border-color:rgba(63,185,80,0.25);color:var(--green); }

.hero-read-btn {
  display:inline-flex;align-items:center;gap:6px;
  margin-top:4px;
  font-size:12px;font-weight:600;color:var(--accent);
  transition:all 0.3s;
  align-self:flex-start;
}
.hero-read-btn .arrow {
  display:inline-block;
  transition:transform 0.3s;
}
.hero-card:hover .hero-read-btn .arrow { transform:translateX(4px); }

/* ══════════ ARCHIVE TIMELINE ══════════ */
.archive-section { margin-top:8px; }

.archive-timeline {
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 32px;
}

.archive-timeline::before {
  content:'';position:absolute;
  left:50%;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,var(--accent-border),var(--border),transparent);
  transform:translateX(-50%);
}

.timeline-item {
  position:relative;
  padding:0 0 16px 0;
  display:flex;
  align-items:flex-start;
  gap:14px;
  text-decoration:none;
  transition:all 0.3s ease;
  -webkit-tap-highlight-color:transparent;
}

.timeline-item:nth-child(odd) {
  flex-direction:row-reverse;
  text-align:right;
  padding-right:20px;
  grid-column:1;
  justify-self:end;
  width:100%;
}
.timeline-item:nth-child(even) {
  padding-left:20px;
  grid-column:2;
  width:100%;
}

.timeline-dot {
  position:absolute;
  top:6px;
  width:10px;height:10px;border-radius:50%;
  background:var(--bg-primary);
  border:2px solid var(--border);
  transition:all 0.3s;
  z-index:2;
}
.timeline-item:nth-child(odd) .timeline-dot { right:-5px; }
.timeline-item:nth-child(even) .timeline-dot { left:-5px; }

.timeline-content {
  flex:1;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  min-width:0;
}
.timeline-content::before {
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--purple));
  opacity:0;transition:opacity 0.3s;
}
.timeline-item:hover .timeline-content {
  border-color:var(--accent-border);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.timeline-item:hover .timeline-content::before { opacity:1; }

.timeline-item:active .timeline-content {
  background:var(--bg-hover);
}

.tl-header {
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-bottom:6px;
  flex-wrap:wrap;
}
.timeline-item:nth-child(odd) .tl-header { flex-direction:row-reverse; }

.tl-date {
  font-size:13px;font-weight:700;color:var(--text-primary);
  font-family:'SF Mono','Menlo',monospace;
  transition:color 0.3s;
  white-space:nowrap;
}
.timeline-item:hover .tl-date { color:var(--accent); }

.tl-weekday {
  font-size:10px;color:var(--text-muted);
  background:rgba(0,212,255,0.06);
  padding:2px 8px;border-radius:4px;
  white-space:nowrap;
}
/* 时段标签：盘前/盘后（黄），与星期标签同款紧凑 */
.tl-slot-badge {
  font-size:10px;color:#f0b429;
  background:rgba(240,180,41,0.10);
  border:1px solid rgba(240,180,41,0.3);
  padding:1px 7px;border-radius:4px;
  white-space:nowrap;
}
/* 时段标识强化：盘前=橙、盘后=紫，突出展示且与涨红跌绿区分 */
.hero-badge.slot-pre {
  background:linear-gradient(135deg,#ffa657,#e8893a) !important;
  color:#1a1005 !important;
  box-shadow:0 0 14px rgba(255,166,87,0.4);
}
.hero-badge.slot-post {
  background:linear-gradient(135deg,#bc8cff,#8250df) !important;
  color:#ffffff !important;
  box-shadow:0 0 14px rgba(188,140,255,0.4);
}
.hero-badge.slot-pre .hero-badge-dot,
.hero-badge.slot-post .hero-badge-dot { background:currentColor; }
.tl-slot-badge.slot-pre {
  color:#ffa657 !important;
  background:rgba(255,166,87,0.16) !important;
  border-color:rgba(255,166,87,0.55) !important;
  font-size:11px;font-weight:800;padding:2px 9px;
}
.tl-slot-badge.slot-post {
  color:#bc8cff !important;
  background:rgba(188,140,255,0.16) !important;
  border-color:rgba(188,140,255,0.55) !important;
  font-size:11px;font-weight:800;padding:2px 9px;
}
body.light-theme .hero-badge.slot-pre { background:linear-gradient(135deg,#ffa657,#e8893a) !important;color:#1a1005 !important; }
body.light-theme .hero-badge.slot-post { background:linear-gradient(135deg,#bc8cff,#8250df) !important;color:#ffffff !important; }
body.light-theme .tl-slot-badge.slot-pre { color:#b8621a !important;background:rgba(255,166,87,0.18) !important;border-color:rgba(255,166,87,0.6) !important; }
body.light-theme .tl-slot-badge.slot-post { color:#6f3fd0 !important;background:rgba(188,140,255,0.18) !important;border-color:rgba(188,140,255,0.6) !important; }
.tl-title {
  font-size:12px;color:var(--text-secondary);line-height:1.5;
  transition:color 0.3s;
  word-break:break-word;
}
.timeline-item:hover .tl-title { color:var(--text-primary); }

.tl-arrow {
  display:inline-block;font-size:10px;color:var(--accent);
  margin-top:4px;transition:all 0.3s;
  opacity:0;transform:translateX(-4px);
}
.timeline-item:hover .tl-arrow { opacity:1;transform:translateX(0); }
.timeline-item:nth-child(odd) .tl-arrow { transform:translateX(4px); }
.timeline-item:nth-child(odd):hover .tl-arrow { transform:translateX(0); }

/* ══════════ FOOTER ══════════ */
.site-footer {
  max-width:1200px;margin:48px auto 0;padding:0 24px 32px;
}
.footer-divider {
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-border),var(--purple),var(--accent-border),transparent);
  margin-bottom:24px;
  position:relative;
}
.footer-divider::before {
  content:'';position:absolute;
  left:50%;top:-1px;transform:translateX(-50%);
  width:48px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--purple));
  box-shadow:0 0 10px rgba(0,212,255,0.3);
}
.footer-content {
  text-align:center;
  color:var(--text-muted);font-size:11px;letter-spacing:0.5px;
  line-height:1.8;
}
.footer-content a { color:var(--accent);text-decoration:none;transition:color 0.2s; }
.footer-content a:hover { color:var(--text-primary); }

/* ══════════ ANIMATIONS ══════════ */
@keyframes fadeInUp {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.fade-in { animation:fadeInUp 0.5s ease forwards }
.fade-in-delay-1 { animation-delay:0.1s;opacity:0 }
.fade-in-delay-2 { animation-delay:0.2s;opacity:0 }
.fade-in-delay-3 { animation-delay:0.3s;opacity:0 }

/* ══════════ MOBILE (<=768px) ══════════ */
@media (max-width: 768px) {
  /* 通用 */
  body { line-height:1.6; }


/* 密码锁 */

  /* Header - 紧凑布局 */
  .header { position:sticky; }
  .header-inner { padding:12px 16px 10px; }

  .header-top {
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:8px;
  }
  .brand-title { min-width:0; }

  .brand-icon {
    width:44px;height:44px;
    border-radius:10px;
  }
  .brand-icon svg { width:22px;height:22px; }

  .brand-title { gap:2px; }

// 🚫 严禁退回相对文件名：资料库页面环境下会解析成 /space/d/xxx 而 404。

};
const STATIC_BASE = "https://sheng-2000.github.io/laosheng-zaodao/";
// 时段前缀：pre=盘前_、post=盘后_、其余=空串
function prefixFor(slot) {
  return slot === 'pre' ? '盘前_' : slot === 'post' ? '盘后_' : '';
}
// 传入整条 report，按 date+slot 查绝对链接；无链接时回退带前缀文件名的静态站绝对 URL
function getLink(r) {
  const key = r.slot ? `${r.date}_${r.slot}` : r.date;
  return REPORT_URLS[key] || STATIC_BASE + prefixFor(r.slot) + `老盛早知道_${r.date}.html`;
}

// 从标题中提取前3个关键词（用·分割）
function extractKeywords(title) {
  const parts = title.split('·').map(s => s.trim()).filter(Boolean);
  return parts.slice(0, 3);
}
// 时段中文标签：用于卡片上区分盘前/盘后
function slotLabel(slot) {
  return slot === 'pre' ? '盘前' : slot === 'post' ? '盘后' : '';
}
// 时段徽章配色类名：盘前=橙(slot-pre)、盘后=紫(slot-post)
function slotClass(slot) {
  return slot === 'pre' ? 'slot-pre' : slot === 'post' ? 'slot-post' : '';
}
